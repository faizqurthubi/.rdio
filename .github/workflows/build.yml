name: Build (uji kompilasi)

# Membangun APK debug + unit test pada setiap push ke main, tanpa menerbitkan rilis.
# APK hasil build bisa diunduh dari tab Actions -> run -> Artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest sudah membawa Android SDK (ANDROID_HOME sudah terisi).
      - name: Info SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3

      - name: Aset katalog
        run: |
          set -e
          test -f app/src/main/assets/stations.json
          echo "logo: $(ls app/src/main/assets/logos | wc -l)"

      - name: Build + unit test
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "--- ringkas error kompilasi ---"
            grep -E "^(e: |w: .*error)|error:|FAILURE:" build.log | head -20 || true
            grep -E "^e: " build.log | head -12 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi

      - name: Ringkas hasil test
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, os
          tot = fail = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              s = open(f).read()
              m = re.search(r'tests="(\d+)".*?failures="(\d+)"', s)
              if m:
                  tot += int(m.group(1)); fail += int(m.group(2))
          print(f"test: {tot} lulus, {fail} gagal")
          if fail: raise SystemExit(1)
          EOF

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: OtoRadio-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
